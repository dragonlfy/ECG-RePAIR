[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-repair"
version = "0.1.0"
description = "Criterion-guided verification and memory-conditioned repair of ECG reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "PyYAML>=6.0"]

[project.optional-dependencies]
ecg = ["neurokit2>=0.2.7", "wfdb>=4.1"]
rag = ["pypdf>=4.0"]
dev = ["pytest>=7.4", "build>=1.0"]

[project.urls]
Repository = "https://github.com/dragonlfy/ECG-RePAIR"
Issues = "https://github.com/dragonlfy/ECG-RePAIR/issues"

[project.scripts]
ecg-repair = "ecg_repair.cli:main"
ecg-framework = "ecg_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecg_framework = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
